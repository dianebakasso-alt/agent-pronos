name: Sonde2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python outils/sonde2.py
      - name: Sauvegarder
        run: |
          git config user.name "agent-pronos"
          git config user.email "agent-pronos@users.noreply.github.com"
          git add data/sonde2.json
          git commit -m "Sonde" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
