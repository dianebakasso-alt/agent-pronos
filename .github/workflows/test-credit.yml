name: Tester le crédit IA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python outils/test_credit.py
      - name: Sauvegarder
        run: |
          git config user.name "agent-pronos"
          git config user.email "agent-pronos@users.noreply.github.com"
          git add data/test_credit.json
          git commit -m "Test du crédit IA" || exit 0
          git pull --rebase -X theirs || true
          git push || true
