name: Rattrapage des autopsies

on:
  workflow_dispatch:
    inputs:
      budget:
        description: "Budget maximum en euros"
        default: "2"
      max:
        description: "Nombre maximum d'autopsies"
        default: "100000"

permissions:
  contents: write

jobs:
  rattrapage:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Autopsies
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUDGET: ${{ github.event.inputs.budget }}
          MAX: ${{ github.event.inputs.max }}
        run: python outils/rattrapage.py | tee data/rattrapage_log.txt
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "agent-pronos"
          git config user.email "agent-pronos@users.noreply.github.com"
          git add data/
          git commit -m "Rattrapage des autopsies" || exit 0
          git pull --rebase -X theirs || true
          git push || true
